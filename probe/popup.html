<html lang="zh-Hant"><head><meta charset="utf-8"><title>核心驗證</title><style>

</style></head><body><h1>Chat Bookmark 核心驗證</h1><p id="status" role="status">請在 Gmail Chat 的訊息上按右鍵，選「驗證：收藏此討論到 Bookmark」，再開啟這個視窗。</p><pre id="result" hidden></pre><label for="official">Google「複製訊息連結」的網址（比對用）</label><input id="official" type="url" placeholder="https://chat.google.com/room/…"><button id="compare" disabled>比對官方連結</button><p id="comparison" role="status"></p><button id="open" disabled>在原 Gmail 分頁跳回討論</button><button id="clear">清除驗證暫存</button><small>測試版：只暫存最近一次右鍵選中的識別碼與連結，不上傳資料。關閉瀏覽器或重載擴充功能後清除。</small><script src="popup.js"></script></body></html>
